{% set sdk_version = "8.0.424" %}
{% set runtime_version = "8.0.30" %}
{% set framework = '.'.join(sdk_version.split('.')[:2]) %}
{% set sha256 = "fc86992aec3536e60383b4decbdfa762f16171b5d52e085d8c0a9491577f475d" %}  # [linux and aarch64]
{% set sha256 = "1a0f577b530d52e54c5a53ea0b578fd1ebe421b11bfbf9b29a5bdc413bdbad64" %}  # [linux and x86_64]
{% set sha256 = "17ed13fa3e3b53be06a07bbaed3aa030a319876059194a461f800ff45d4ae394" %}  # [osx and arm64]
{% set sha256 = "4f441ce610f8da617cd89c8cf4cb2774f4400e46be519df34bd75f7bcca552be" %}  # [osx and x86_64]
{% set sha256 = "0b41a6739ff6587a8c854f1091c371dcadcbb5e9e28d99bdde1db6ad72abd22c" %}  # [win and x86_64]
{% set sha256 = "2e666630e7daf2d9867f298ad476f7973381f0b8d352a90e8b7c4482851dce93" %}  # [win and arm64]
{% set platform = "linux-arm64" %}  # [linux and aarch64]
{% set platform = "linux-x64" %}  # [linux and x86_64]
{% set platform = "osx-arm64" %}  # [osx and arm64]
{% set platform = "osx-x64" %}  # [osx and x86_64]
{% set platform = "win-x64" %}  # [win and x86_64]
{% set platform = "win-arm64" %}  # [win and arm64]
{% set ext = "tar.gz" %}  # [not win]
{% set ext = "zip" %}  # [win]

package:
  name: dotnet
  version: {{ sdk_version }}

source:
  url: https://dotnetcli.azureedge.net/dotnet/Sdk/{{ sdk_version }}/dotnet-sdk-{{ sdk_version }}-{{ platform }}.{{ ext }}
  sha256: {{ sha256 }}
  folder: dotnet

build:
  number: 0
  binary_relocation: False  # [osx]

outputs:
  - name: dotnet
    version: {{ sdk_version }}
    requirements:
      run:
        - dotnet-aspnetcore ={{ runtime_version }}
        - dotnet-desktop ={{ runtime_version }}  # [win]
        - dotnet-runtime ={{ runtime_version }}
        - dotnet-sdk ={{ sdk_version }}
    test:
      commands:
        - test "${DOTNET_ROOT}" = "${CONDA_PREFIX}/lib/dotnet"  # [unix]
        - test "${DOTNET_TOOLS}" = "${CONDA_PREFIX}/lib/dotnet/tools"  # [unix]
        - if not defined DOTNET_ROOT exit 1  # [win]
        - if not defined DOTNET_TOOLS exit 1  # [win]
        # Value, not just existence (#13). /I because Windows paths are
        # case-insensitive and CONDA_PREFIX's casing need not match. Compared
        # against CONDA_PREFIX rather than PREFIX because that is what
        # activate.d/dotnet-root.bat derives DOTNET_ROOT from. Single
        # backslashes: the doubled form used by the `if not exist` tests nearby
        # works for paths but not for string equality.
        - if /I not "%DOTNET_ROOT%"=="%CONDA_PREFIX%\dotnet" exit 1  # [win]
        - if /I not "%DOTNET_TOOLS%"=="%CONDA_PREFIX%\dotnet\tools" exit 1  # [win]

  - name: dotnet-runtime
    version: {{ runtime_version }}
    script: build-runtime.bat  # [win]
    script: build-runtime.sh  # [not win]
    build:
      # Repeated per output on purpose: conda-build does NOT inherit top-level
      # build settings into outputs, so the top-level `binary_relocation: False`
      # never covered the files these outputs actually ship.
      binary_relocation: False  # [osx]
      script_env:
        - DOTNET_RUNTIME_VERSION={{ runtime_version }}
    requirements:
      build:
        - {{ compiler('cxx') }}  # [linux]
        - {{ stdlib('c') }}  # [linux]
        - posix  # [win]
      run:
        - icu  # [unix]
        # <4 is required, not cosmetic. openssl 4.x ships only libssl.so.4 /
        # libcrypto.so.4 with no .so.3 compatibility symlink, and .NET's crypto
        # shim dlopens a fixed list of sonames topping out at libssl.so.3. An
        # unpinned openssl resolves to 4.x and every crypto call aborts with
        # "No usable version of libssl was found".
        - openssl <4  # [aarch64]
        - zlib  # [aarch64]
    test:
      commands:
        - dotnet --list-runtimes
    about:
      home: https://github.com/dotnet/runtime
      license: MIT
      license_file: dotnet/LICENSE.txt
      summary: |
        .NET Core is a free and open-source managed computer software
        framework for the Windows, Linux, and macOS operating systems.

  - name: dotnet-sdk
    version: {{ sdk_version }}
    script: build-sdk.bat  # [win]
    script: build-sdk.sh  # [not win]
    build:
      binary_relocation: False  # [osx]
    requirements:
      build:
        - {{ compiler('cxx') }}  # [linux]
        - {{ stdlib('c') }}  # [linux]
        - posix  # [win]
      run:
        - dotnet-runtime ={{ runtime_version }}
        - zlib  # [aarch64]
    test:
      commands:
        - test -d $PREFIX/lib/dotnet/packs  # [unix]
        - test -d $PREFIX/lib/dotnet/sdk  # [unix]
        - test -d $PREFIX/lib/dotnet/templates  # [unix]
        - if not exist %PREFIX%\\dotnet\\packs exit 1  # [win]
        - if not exist %PREFIX%\\dotnet\\sdk exit 1  # [win]
        - if not exist %PREFIX%\\dotnet\\templates exit 1  # [win]
        - dotnet --version
        - mkdir self-test && cd self-test && dotnet new console && dotnet clean && dotnet build  # [unix]
        - dotnet exec bin/Debug/net{{ framework }}/self-test.dll > self-test.txt  # [unix]
        - grep "Hello, World!" self-test.txt  # [unix]
        - mkdir self-test && cd self-test && dotnet new console && dotnet build && dotnet exec "bin/Debug/net{{ framework }}/self-test.dll" | findstr "Hello, World!"  # [win]
    about:
      home: https://github.com/dotnet/sdk
      license: MIT
      license_file: dotnet/LICENSE.txt
      summary: |
        .NET Core is a free and open-source managed computer software
        framework for the Windows, Linux, and macOS operating systems.

  - name: dotnet-aspnetcore
    version: {{ runtime_version }}
    script: build-aspnetcore.bat  # [win]
    script: build-aspnetcore.sh  # [not win]
    build:
      binary_relocation: False  # [osx]
    requirements:
      run:
        - dotnet-runtime ={{ runtime_version }}
    test:
      commands:
        - test -d $PREFIX/lib/dotnet/shared/Microsoft.AspNetCore.App  # [not win]
        - if not exist %PREFIX%\\dotnet\\shared\\Microsoft.AspNetCore.App exit 1  # [win]
    about:
      home: https://github.com/dotnet/aspnetcore
      license: MIT
      license_file: dotnet/LICENSE.txt
      summary: |
        .NET Core is a free and open-source managed computer software
        framework for the Windows, Linux, and macOS operating systems.

  - name: dotnet-desktop                                                              # [win]
    version: {{ runtime_version }}                                                    # [win]
    script: build-desktop.bat                                                         # [win]
    requirements:                                                                     # [win]
      build:                                                                          # [win]
        - posix                                                                       # [win]
      run:                                                                            # [win]
        - dotnet-runtime ={{ runtime_version }}                                       # [win]
    test:                                                                             # [win]
      commands:                                                                       # [win]
        - if not exist %PREFIX%\\dotnet\\shared\\Microsoft.WindowsDesktop.App exit 1  # [win]
    about:                                                                            # [win]
      home: https://github.com/dotnet/desktop                                         # [win]
      license: MIT                                                                    # [win]
      license_file: dotnet/LICENSE.txt                                                # [win]
      summary: .NET Core is a free and open-source managed computer software framework for the Windows, Linux, and macOS operating systems.  # [win]

about:
  home: https://github.com/dotnet/core
  license: MIT
  license_file: dotnet/LICENSE.txt
  summary: |
    .NET Core is a free and open-source managed computer software
    framework for the Windows, Linux, and macOS operating systems.

extra:
  recipe-maintainers:
    - dhirschfeld
    - ZimmerA
    - acesnik
